name: board
# SELF-SCHEDULING BOARD GENERATION (2026-08-02, owner's item 1).
# Parlay Lab generates itself, seven days a week, zero operator minutes.
#
# ═══ THIS IS NOT A 15-MINUTE CRON, AND THE REASON IS MEASURED IN THIS REPO ═══════════════
# The brief specified a schedule every 15 minutes that evaluates the window each tick. On THIS
# account that cannot work, and props-history.yml L26-30 already records why:
#   "every scheduled workflow lands in one of two batches: ~20:00-21:00Z or ~06:00-08:30Z the
#    NEXT morning ... a lottery drawing on the same throttled queue that drops 19 of 24 ticks"
# with a measured delay of 40-80 minutes, median ~56 (handoff §0.16).
#
# THE DELAY IS LARGER THAN THE WINDOW. Sunday 2026-08-02's two-condition window was 17:05-17:35Z
# — thirty minutes. A tick scheduled at 17:00Z lands at 17:40-18:20Z, after first pitch, every
# time. More ticks do not help; they queue behind each other on the same throttle.
#
# SO THE JITTER IS ABSORBED BY HOLDING, NOT BY TICKING — snapshot_props.py's proven
# _wait_for_window pattern. The job starts EARLY, lands whenever the queue delivers it, then
# polls the condition from inside the runner (statsapi, free) until it holds, then fires ONCE.
# Delivery jitter becomes irrelevant by construction. The repo is PUBLIC, so hosted-runner
# minutes are unlimited and a multi-hour hold costs nothing.
#
# ═══ COST ════════════════════════════════════════════════════════════════════════════════
# The scheduler itself: ZERO Odds credits. statsapi is keyless and free; the only paid call is
# the single /api/generate it fires, at the corrected model 1 + 6 x unstarted events.
# Measured means: weekday 50.8, Saturday 31 @ 23:10Z, Sunday 86 @ 17:15Z -> ~53 credits/day
# across a 7-day week, 371/week. See handoff §12.9.
#
# ═══ SAFETY NET, UNCHANGED ═══════════════════════════════════════════════════════════════
# This adds a caller; it removes no protection. MAX_RUNS_PER_DATE (3), the dead-slate refusal,
# the low-ceiling refusal (MIN_ACHIEVABLE 0.15) and the good-board skip all still gate the
# route. A double fire is refused by the route, not by trusting this file.
#
# NOTE: like every workflow here, this is only SCHEDULED if it exists on the default branch
# (main). On frontend-rebuild it can still be run by hand via workflow_dispatch.
# TIMING: SENSITIVE — guard: evaluate. The window is ~30 minutes against a measured 40-80-minute
#   Actions delay, so the cron time cannot be the fire time. The runner starts EARLY and holds,
#   polling the two-condition evaluation until it holds, then fires once. The schedule chooses
#   when to start waiting; `evaluate` chooses when to fire.
on:
  schedule:
    # Deliberately EARLY on every calendar day. The runner holds; the clock does not decide.
    # 13:00Z lands ~13:40-14:20Z at the measured delay, which is ahead of the earliest window
    # observed across 52 sampled weekend slates (Sunday 17:10Z, Saturday 20:15Z) and ahead of
    # the weekday window (21:45Z) with hours of hold budget to spare.
    - cron: "0 13 * * *"
    # One cheap re-arm, so a dropped 13:00 tick does not lose the day. If the first job already
    # fired, MAX_RUNS_PER_DATE and the good-board skip refuse this one at zero Odds cost.
    - cron: "0 16 * * *"
  workflow_dispatch:

concurrency:
  # Two overlapping holders would both poll and both fire the moment the window opened. Serialise
  # them. cancel-in-progress stays FALSE: a holding runner is doing its job, not hung.
  group: board
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    # MAX_WAIT_S is 300 min; +30 for the run itself, under GitHub's 360-minute kill so a timeout
    # is ours and legible rather than a mid-hold execution kill.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the scheduler from the app branch
        run: |
          git fetch origin frontend-rebuild
          git checkout origin/frontend-rebuild -- tools/board_window.py
      - name: Hold for the two-condition window, then fire once
        env:
          # THE SECRET NEVER REACHES A LOG. board_window.py reads it from the environment and
          # sends it as the x-cron-key header; it is never an argv, never printed, never echoed.
          # It must exist as a repository secret named CRON_SECRET — Josh sets it; nobody else
          # types it. Absent, the tool prints a config error and exits WITHOUT firing (78).
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: python3 tools/board_window.py
