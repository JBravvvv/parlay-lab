name: engine-v2-props-history
# Player-prop line snapshots -> line-history branch (data/props/).
#
# 2026-07-26 — WHY THIS IS NOW MANY CRONS INSTEAD OF TWO.
# The two-cron version never captured a close. Measured from the Actions API over 15 days,
# `0 17` actually starts at ~20:20Z (+3.3h) and `45 22` at ~07:30Z the NEXT day (+8.75h);
# both are event:schedule, so GitHub is queueing them and the delay is systematic. The
# "near-close" sweep was landing nine hours late, after the games it was meant to price had
# been played. Every archived close was really T-2.5h or earlier — see docs/phase2-memo.md.
#
# A THIRD CRON WOULD INHERIT THE SAME DELAY. The trigger cannot be trusted to arrive on
# time, so the SCRIPT decides: tools/snapshot_props.py takes a `close` capture only when the
# next unstarted first pitch is within ~95 min, at most one per 40 min, and otherwise writes
# a cheap `pre` reading. Firing hourly across the whole evening means SOME firing lands in
# the window whatever the queueing delay does. Same self-pacing pattern as /api/clv, and for
# the same reason: a close not captured during the window is unrecoverable.
#
# The reliable long-term trigger is cron-job.org (already running the CLV job 96x/day),
# which does not queue. These crons are the delay-tolerant fallback.
# TIMING: SENSITIVE — guard: _snapshot_kind (tools/snapshot_props.py) — the script decides `close`
#   vs `pre` from the next unstarted first pitch, never from the clock. Ten crons so some firing
#   lands inside the 95-minute window whatever the queue delay does.
on:
  schedule:
    # 2026-07-27 — TEN CRONS REPLACED BY ONE THAT WAITS.
    # Measured on this account, every scheduled workflow lands in one of two batches: ~20:00-21:00Z
    # or ~06:00-08:30Z the NEXT morning. Of the ten configured firings only the early one ever
    # arrived usefully; the rest queued into the next morning, after the games. Ten fires inside a
    # 95-minute window was not redundancy, it was a lottery drawing on the same throttled queue
    # that drops 19 of 24 line-history ticks.
    # `--wait` makes the SCRIPT hold the runner until the window opens (tools/snapshot_props.py,
    # _wait_for_window), so one tick is deterministic where ten were not.
    - cron: "0 17 * * *"   # lands ~20:1x-20:5x, then waits ~70 min -> close at ~21:4x for a 23:15 FP
    # two cheap unwaiting fallbacks: if the 17:00 tick is dropped outright (property 2), these
    # still record a `pre` so the day is not blank. They do not wait and cannot take a close.
    - cron: "0 13 * * *"
    - cron: "0 23 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    # explicit, and UNDER GitHub's 360-minute hosted-runner ceiling so a timeout is ours rather
    # than a mid-sweep kill. MAX_WAIT_S (300 min) + the sweep (~5 min for a 15-game slate) fits.
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-history
      - name: Fetch snapshot script from the app branch
        run: |
          git fetch --depth 1 origin frontend-rebuild
          git checkout origin/frontend-rebuild -- tools/snapshot_props.py
      - name: Snapshot props
        # --wait only on the tick that can reach a window; the fallbacks record a `pre` and exit
        run: python3 tools/snapshot_props.py ${{ github.event.schedule == '0 17 * * *' && '--wait' || '' }}
      - name: Commit
        run: |
          git config user.name "engine-v2-bot"
          git config user.email "noreply@github.com"
          git add data/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "prop history: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
