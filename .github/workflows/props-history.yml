name: engine-v2-props-history
# Player-prop line snapshots -> line-history branch (data/props/).
#
# 2026-07-26 — WHY THIS IS NOW MANY CRONS INSTEAD OF TWO.
# The two-cron version never captured a close. Measured from the Actions API over 15 days,
# `0 17` actually starts at ~20:20Z (+3.3h) and `45 22` at ~07:30Z the NEXT day (+8.75h);
# both are event:schedule, so GitHub is queueing them and the delay is systematic. The
# "near-close" sweep was landing nine hours late, after the games it was meant to price had
# been played. Every archived close was really T-2.5h or earlier — see docs/phase2-memo.md.
#
# A THIRD CRON WOULD INHERIT THE SAME DELAY. The trigger cannot be trusted to arrive on
# time, so the SCRIPT decides: tools/snapshot_props.py takes a `close` capture only when the
# next unstarted first pitch is within ~95 min, at most one per 40 min, and otherwise writes
# a cheap `pre` reading. Firing hourly across the whole evening means SOME firing lands in
# the window whatever the queueing delay does. Same self-pacing pattern as /api/clv, and for
# the same reason: a close not captured during the window is unrecoverable.
#
# The reliable long-term trigger is cron-job.org (already running the CLV job 96x/day),
# which does not queue. These crons are the delay-tolerant fallback.
on:
  schedule:
    # 2026-07-31 — CUT FROM TEN TO FOUR (owner's item 1), chosen from the ARCHIVE, not the
    # schedule's shape. Measured over 17 archived days, deliveries land in four bands and the
    # declared hour does not control when a run arrives — only how many arrive:
    #   20-21Z  17 paid, 7.9 ev/snap, median lead 112 min ->  0 closes (17 min outside the window)
    #   23Z      4 paid, 6.2 ev/snap, median lead  18 min ->  4 closes
    #   00Z      3 paid, 4.0 ev/snap, median lead  85 min ->  3 closes
    #   06-11Z  33 paid, 13.5 ev/snap, median lead 508 min -> 0 closes, and 72% OF ALL SPEND
    # ALL SEVEN archived closes came from the 23Z and 00Z bands. The seven queued crons produced
    # none of them and three quarters of the cost. MIN_GAP is untouched; snapshot_props.py is
    # untouched. Reversible: uncomment. Ceiling falls ~339 -> ~185 credits/day (measured
    # ev/snapshot x the measured 5.84 credits/event). docs/branch-firing-audit.md PART THREE.
    - cron: "0 17 * * *"   # -> 20:0x-20:5x, 19/20 days. The same-day `pre`, median lead 112 min.
    - cron: "0 20 * * *"   # -> ~23:3x. LOAD-BEARING: 4 of the 7 archived closes.
    - cron: "0 21 * * *"   # -> ~00:1x. LOAD-BEARING: the other 3.
    - cron: "30 22 * * *"  # -> queues to the next morning batch = the 8.5h-out opener, the wide
                           #    end of the model-vs-close span. One queued tick delivered on
                           #    15 of 15 days in the two-cron era, so one is enough.
    # COMMENTED OUT 2026-07-31 — six queued crons that only ever added morning duplicates:
    # - cron: "0 22 * * *"
    # - cron: "0 23 * * *"
    # - cron: "30 23 * * *"
    # - cron: "0 0 * * *"
    # - cron: "30 0 * * *"
    # - cron: "0 1 * * *"
  workflow_dispatch:

# MIN_GAP reads the last paid timestamp from the COMMITTED day-file, so overlapping
# runners all see stale state and all pay (tools/snapshot_props.py L143-151; measured
# trio 08:02/08:05/08:07Z). Queue-mode serialisation makes the committed state fresh
# for each runner. cancel-in-progress stays FALSE: redundancy is the reliability
# property — delivery is never cancelled, only serialised (the MIN_GAP conditions).
concurrency:
  group: props-history
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-history
      - name: Fetch snapshot script from the app branch
        run: |
          git fetch --depth 1 origin frontend-rebuild
          git checkout origin/frontend-rebuild -- tools/snapshot_props.py
      - name: Snapshot props
        run: python3 tools/snapshot_props.py
      - name: Commit
        run: |
          git config user.name "engine-v2-bot"
          git config user.email "noreply@github.com"
          git add data/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "prop history: $(date -u +%Y-%m-%dT%H:%MZ)"
          # push with pull-rebase retry (2026-07-29, owner's authorization): a rejected
          # pusher previously PAID for its sweep and LOST the snapshot (non-ff push, no
          # retry) — strictly worse than the duplicate MIN_GAP replaced. Serialisation
          # is the concurrency group above; this retry is the belt for anything that
          # still overlaps. Queue, never cancel: every cron entry stays.
          for i in 1 2 3; do
            git push && break
            git pull --rebase origin line-history
          done
