name: engine-v2-line-history
# Hourly odds snapshots (MLB h2h/totals/spreads, us+eu incl. Pinnacle) into the
# line-history branch — the open-to-close archive the backtest harness reads.
# ~6 API credits per run through the app's own proxy; no secrets needed.
# TIMING: INSENSITIVE — every snapshot stamps its own `t`, and every downstream analysis reads that
#   observed timestamp, never the cron hour. Queue drops thin the DENSITY (measured: 3-5 of 24 ticks
#   run) but cannot mis-timestamp a reading. Density is a coverage question, not a timing one.
on:
  # schedule:                              # DISABLED 2026-07-31 (owner's decision — the
  #   - cron: "12 * * * *"                  # cadence ration. NOTHING READS THIS JOB'S OUTPUT:
  #                                         # close_fair/close_capture/phase2_series_b all read
  #                                         # data/props (a different workflow), a repo-wide grep
  #                                         # finds zero consumers of data/YYYY-MM-DD.json, and
  #                                         # docs/credit-budget.md L192 says so independently.
  #                                         # Measured delivery ~7.5 runs/day x 6 credits = ~45/day.
  #                                         # Reversible: uncomment this block, one commit.
  #                                         # Guard: tests/line-history-consumers.test.ts fails if a
  #                                         # consumer ever appears.)
  workflow_dispatch:

permissions:
  contents: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: line-history
      - name: Fetch snapshot script from the app branch
        run: |
          git fetch --depth 1 origin frontend-rebuild
          git checkout origin/frontend-rebuild -- tools/snapshot_odds.py
      - name: Snapshot
        run: python3 tools/snapshot_odds.py
      - name: Commit
        run: |
          git config user.name "engine-v2-bot"
          git config user.email "noreply@github.com"
          git add data/
          git diff --cached --quiet && echo "no change" && exit 0
          git commit -m "line history: $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
